#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "parley"
name = "Parley"
description.en = "Federated, decentralised chat that speaks plain IRC"
description.fr = "Chat fédéré et décentralisé qui parle clairement IRC"

version = "0.6.0~ynh1"

maintainers = ["doesnm"]

[upstream]
license = "MIT"
admindoc = "https://git.mills.io/prologic/parley/src/branch/main#running-your-own-instance"
code = "https://git.mills.io/prologic/parley"
fund = "https://prologic.dev/donate.html"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64"]
multi_instance = true

sso = true
ldap = false

disk = "150M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    # The web interface is behind the YunoHost SSO, so this is the group that may
    # use it. Federation is NOT behind it: the public paths are declared as
    # separate permissions below, because a portal gate over /api or /inbox would
    # leave the instance looking healthy while no peer could deliver anything.
    default = "all_users"

    [install.admin]
    type = "user"

    [install.admin_password]
    type = "password"

[resources]
 
    [resources.sources]

    [resources.sources.main]
    # A binary release, not the source archive: the package installs parleyd and
    # parleyctl as they are and never builds anything. v0.6.0 is the first
    # release that ships them.
    url = "https://git.mills.io/prologic/parley/releases/download/v0.6.0/parley_0.6.0_linux_amd64.tar.gz"
    sha256 = "0fd41fc115f161e4b02997d8c3d7d0803ac96173fa77a64ee2c364a56fb720e4"
    # The archive is flat (parleyd, parleyctl, LICENSE, README.md at its root),
    # so the helper must not strip a top-level directory that is not there.
    in_subdir = false

    autoupdate.strategy = "latest_gitea_release"
    autoupdate.asset.amd64 = "^parley_.*_linux_amd64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    # Everything a peer or an IRC client needs, open to visitors. parleyd
    # authenticates its own API with bearer tokens, so "visitors" here means
    # "ssowat does not ask for a YunoHost session", not "no authentication".
    federation_api.url = "/api"
    federation_api.allowed = "visitors"
    federation_api.show_tile = false
    federation_api.auth_header = false

    federation_inbox.url = "/inbox"
    federation_inbox.allowed = "visitors"
    federation_inbox.show_tile = false
    federation_inbox.auth_header = false

    federation_wellknown.url = "/.well-known"
    federation_wellknown.allowed = "visitors"
    federation_wellknown.show_tile = false
    federation_wellknown.auth_header = false

    # Peers fetch avatars while unfurling messages from this instance.
    avatars.url = "/avatars"
    avatars.allowed = "visitors"
    avatars.show_tile = false
    avatars.auth_header = false

    [resources.ports]
