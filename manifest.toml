#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "parley"
name = "Parley"
description.en = "Federated, decentralised chat that speaks plain IRC"
description.fr = "Chat fédéré et décentralisé qui parle clairement IRC"

version = "0.5.0~ynh1"

maintainers = ["doesnm"]

[upstream]
license = "MIT"
admindoc = "https://git.mills.io/prologic/parley/src/branch/main#running-your-own-instance"
code = "https://git.mills.io/prologic/parley"
fund = "https://prologic.dev/donate.html"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "amd64"
multi_instance = true
sso = "true"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["fr", "en"]
    default = "fr"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Use the help field to add an information for the admin about this question."
    help.fr = "Utilisez le champ aide pour ajouter une information à l'intention de l'administrateur à propos de cette question."
    type = "password"

[resources]
 
    [resources.sources]

    [resources.sources.main]
    url = "https://git.mills.io/prologic/parley/archive/v0.5.0.tar.gz"
    sha256 = "414f5e8b67e9eb6f954b231d6878ad364edc3858e8ae474c28292568b8a10569"


    autoupdate.strategy = "latest_gitea_release"

    [resources.system_user]

    [resources.install_dir]    

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    #[resources.apt]
    #packages = "mariadb-server, deb1, deb2, php8.3-foo, php8.3-bar"
