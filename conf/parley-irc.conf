# IRC over TLS, terminated by nginx in front of parleyd.
#
# This file is rendered to /etc/nginx/modules-enabled/parley-irc.conf, which
# nginx.conf includes at the TOP level -- that is the only way to get a stream{}
# block into YunoHost's nginx without editing nginx.conf, and it is exactly how
# YunoHost itself injects its TLS-passthrough stream block. Verified on a lab
# instance: `yunohost tools regen-conf nginx --force` leaves foreign files in
# that directory alone.
#
# parleyd serves plaintext IRC on loopback and expects a TLS terminator in
# front; it also expects the PROXY header, and only accepts it from addresses
# listed in PARLEY_IRC_PROXIES (set in parley.env). Both halves are required:
# without the env var parleyd parses the PROXY line as an IRC command and
# answers "451 * :You have not registered".

stream {
    server {
        listen __IRC_PORT__ ssl;
        listen [::]:__IRC_PORT__ ssl;

        ssl_certificate     /etc/yunohost/certs/__DOMAIN__/crt.pem;
        ssl_certificate_key /etc/yunohost/certs/__DOMAIN__/key.pem;

        proxy_pass 127.0.0.1:__IRC_LOCAL_PORT__;
        proxy_protocol on;
        proxy_timeout 1h;
    }
}
