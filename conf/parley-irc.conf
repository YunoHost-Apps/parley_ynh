# One IRC terminator per instance; the shared stream{} wrapper includes this file.
server {
    listen __IRC_PORT__ ssl;
    listen [::]:__IRC_PORT__ ssl;

    ssl_certificate     /etc/yunohost/certs/__DOMAIN__/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/__DOMAIN__/key.pem;

    proxy_pass 127.0.0.1:__IRC_LOCAL_PORT__;
    proxy_protocol on;
    proxy_timeout 1h;
}
