# One IRC terminator for this instance. It is a bare `server {}` on purpose:
# nginx allows a single `stream {}` block in the whole configuration, so the
# wrapper lives once in /etc/nginx/modules-enabled/parley-stream.conf and each
# instance — parley, parley__2, ... — drops its server into
# /etc/nginx/stream.d/ where that wrapper includes it.
#
# The wrapper and the directory are created by the first instance and removed by
# the last one; see scripts/install and scripts/remove.
server {
    listen __IRC_PORT__ ssl;
    listen [::]:__IRC_PORT__ ssl;

    ssl_certificate     /etc/yunohost/certs/__DOMAIN__/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/__DOMAIN__/key.pem;

    proxy_pass 127.0.0.1:__IRC_LOCAL_PORT__;
    proxy_protocol on;
    proxy_timeout 1h;
}
