# The single `stream {}` block this machine is allowed to have. Rendered into
# /etc/nginx/modules-enabled/ so nginx reads it at the top level (conf.d is the
# http{} context). Everything instance-specific lives in /etc/nginx/stream.d/,
# because a second `stream {}` block anywhere is a hard configuration error.
stream {
    include /etc/nginx/stream.d/parley*.conf;
}
