location __PATH__/admin/events {
    proxy_pass http://127.0.0.1:__PORT__;

    # SSO: with_auth when sso = true, no_auth when sso = false
    include proxy_params_with_auth;

    # keep the connection open to the upstream; the include sets "close"
    proxy_set_header Connection "";

    # Server-Sent Events: no buffering, no compression, no short timeout
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__;

    include proxy_params_with_auth;

    # avatars and the instance logo (v0.5.0 uploads)
    client_max_body_size 20M;
}
