# Parley serves HTTP; nginx terminates TLS and the SSO forwards the identity.

location __PATH__/admin/events {
    proxy_pass http://127.0.0.1:__PORT__/;

    include proxy_params_with_auth;

    # Server-Sent Events need the connection kept open.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;

    include proxy_params_with_auth;

    client_max_body_size 20M;
}
