# Parley is a plain HTTP server behind nginx: it speaks no TLS and serves both
# the web interface and the JSON API on the same listener.
#
# The trailing slash on proxy_pass matters: parleyd serves the app at its own
# root, and only nginx knows about __PATH__. Without it a subpath install would
# forward "/parley-test/..." verbatim and get a 404 from the server.
#
# `sso = true` in the manifest, so ssowat authenticates the request and injects
# Ynh-User / Ynh-User-Email / Ynh-User-Fullname. These includes forward them, and
# parleyd trusts them only from the addresses in PARLEY_TRUSTED_PROXIES. The
# federation paths (/api, /inbox, /.well-known, /avatars) are separate
# permissions open to visitors: ssowat does not gate them, no identity header is
# injected there, and the bearer tokens are what authenticates those requests.

location __PATH__/admin/events {
    proxy_pass http://127.0.0.1:__PORT__/;

    include proxy_params_with_auth;

    # proxy_params sets "close"; Server-Sent Events need it to stay open.
    proxy_set_header Connection "";

    # The admin pages update themselves over SSE. Buffering or compression
    # turns the stream into bursts, and the default 60 s read timeout cuts it.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;

    include proxy_params_with_auth;

    # Avatars and the instance logo, both uploaded in v0.5.0 and later.
    client_max_body_size 20M;
}

# Not here on purpose: IRC. It is raw TCP, not HTTP, so it cannot be proxied from
# this file: conf/parley-irc.conf renders a stream{} block into
# /etc/nginx/modules-enabled/ and terminates TLS on __IRC_PORT__ there.
