#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]


    # install.subdir is excluded again, and now for a real reason: parley's UI
    # uses absolute paths (/assets, /login, /theme) and has no base-path setting,
    # so a subpath install answers 200 on the page and then breaks on every
    # asset. The install script refuses it instead of letting CI discover it.
    # change_url is excluded because that script refuses by design.
    exclude = ["install.subdir", "change_url"]

    [default.curl_tests.wellknown]
        path = "/.well-known/parley/instance.json"
        expect_return_code = 200
        expect_content = "parleyd/"

    [default.curl_tests.landing]
        path = "/"
        expect_return_code = [200, 302]