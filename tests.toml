#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]


    exclude = ["install.subdir","change_url"]

    [default.curl_tests.wellknown]
        path = "/.well-known/parley/instance.json"
        expect_return_code = 200
        expect_content = "parleyd/"

    [default.curl_tests.landing]
        path = "/"
        expect_return_code = [200, 302]